[project]
name = "sistema-flask"
version = "0.1.0"
description = "Projeto Flask simples com SQLite e .env"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0"
]

[project.scripts]
start = "app:main"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "logging_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

